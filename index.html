      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";

      import { getFirestore, initializeFirestore, doc, setDoc, getDoc, getDocs, collection, query, where, updateDoc, deleteDoc, addDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
      import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDjIO6lsGEUzmT0UbNVLN4HY2yMk5-h1WY",
        authDomain: "aies-server-side.firebaseapp.com",
        databaseURL: "https://aies-server-side-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "aies-server-side",

        measurementId: "G-XNLQS17T1N"
      };

      const app = initializeApp(firebaseConfig);
      
      // Force Long Polling to prevent "Could not reach backend" timeouts
      const fs = initializeFirestore(app, {
          experimentalForceLongPolling: true,
          useFetchStreams: false
      });

      // Export to window
      window.fb = {
          db: getDatabase(app),
          fs: fs,
          auth: getAuth(app),
          // RTDB functions
          ref, set, onValue, update, remove, rtdbGet,
          // Firestore functions
          doc, setDoc, getDoc, getDocs, collection, query, where, updateDoc, deleteDoc, addDoc, serverTimestamp, onSnapshot,

    <script>
        (function() {
            // Scroll to top on page load
            window.addEventListener('load', () => {
                window.scrollTo({ top: 0, behavior: 'instant' });
            });
            
            try {
                const cached = localStorage.getItem('bsms_shop_settings');
                if (cached) {
                    const s = JSON.parse(cached);
                    const name = s.shopName || 'BookShop';
                    const logo = s.shopLogo;
                    
                    // Update text immediately
                    const brandEl = document.getElementById('shop-name-brand');
                    if (brandEl) brandEl.textContent = name;
                    const loginBrandEl = document.getElementById('login-brand-text');
                    if (loginBrandEl) loginBrandEl.textContent = name;
                    
                    // Update logos immediately
                    if (logo) {
                        const style = `width:100%;height:100%;object-fit:cover;transform:scale(${s.logoScale || 1}) translate(${s.logoX || 0}%, ${s.logoY || 0}%);`;
                        const sidebarLogo = document.getElementById('sidebar-logo');
                        if (sidebarLogo) sidebarLogo.innerHTML = `<img src="${logo}" style="${style}" onerror="this.style.display='none'">`;
                        const loginLogo = document.getElementById('login-logo');
                        if (loginLogo) loginLogo.innerHTML = `<img src="${logo}" style="${style}" onerror="this.style.display='none'">`;
                    }
                }
            } catch(e) {}
        })();
